name: build

on:
  push:
  pull_request:

jobs:
  compile:
    name: Compile for Arduino Uno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile sketch
        uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: |
            - ./optical-tachometer
          enable-warnings-report: true
          verbose: true
